<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Blueprint</title>
  <desc id="description">Clear instructions for serious AI coding. Three connected stages show Understand, Decide, and Deliver.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08152f"/>
      <stop offset="0.55" stop-color="#102a56"/>
      <stop offset="1" stop-color="#251b52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58c7ff"/>
      <stop offset="0.55" stop-color="#7795ff"/>
      <stop offset="1" stop-color="#b784ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9ac7ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="80" r="190" fill="#845bff" opacity="0.11"/>
  <circle cx="175" cy="390" r="210" fill="#43bfff" opacity="0.1"/>

  <g transform="translate(74 74)">
    <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M10 72V14h58l22 22v62H34z"/>
      <path d="M68 14v24h22"/>
      <path d="M31 58h39M31 76h27"/>
    </g>
    <text x="0" y="170" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="750" letter-spacing="-2">Blueprint</text>
    <text x="2" y="218" fill="#c9d8f3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="450">Clear instructions for serious AI coding.</text>
  </g>

  <g transform="translate(700 82)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <path d="M24 40v210" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <circle cx="24" cy="40" r="17" fill="#0e2347" stroke="#58c7ff" stroke-width="4"/>
    <circle cx="24" cy="145" r="17" fill="#162759" stroke="#7795ff" stroke-width="4"/>
    <circle cx="24" cy="250" r="17" fill="#291e55" stroke="#b784ff" stroke-width="4"/>

    <text x="72" y="55" fill="#ffffff" font-size="48" font-weight="700">Understand</text>
    <text x="72" y="160" fill="#ffffff" font-size="48" font-weight="700">Decide</text>
    <text x="72" y="265" fill="#ffffff" font-size="48" font-weight="700">Deliver</text>
  </g>

  <path d="M74 370h1052" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
</svg>
